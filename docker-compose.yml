services:
  mysql:
    image: mysql:8.4
    container_name: auto-time-marking-mysql
    restart: always
    environment:
      MYSQL_DATABASE: autotimemarking
      MYSQL_USER: autotime
      MYSQL_PASSWORD: autotimepass
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "autotime", "-pautotimepass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
